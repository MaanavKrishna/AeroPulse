# Production-style stack: app + collector + Postgres + Caddy (automatic HTTPS).
#   cp .env.example .env   # fill in, set AEROPULSE_ENV=production and the DB URL below
#   docker compose -f deploy/compose.yaml up -d
# For a local demo instead: AEROPULSE_ENV=development AEROPULSE_PROVIDERS=demo, then
#   docker compose -f deploy/compose.yaml run --rm app aeropulse demo
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aeropulse
      POSTGRES_USER: aeropulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeropulse"]
      interval: 10s

  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      AEROPULSE_DATABASE_URL: postgresql+psycopg://aeropulse:${POSTGRES_PASSWORD}@db:5432/aeropulse
    volumes: [exports:/app/exports]
    depends_on: { db: { condition: service_healthy } }

  collector:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      AEROPULSE_DATABASE_URL: postgresql+psycopg://aeropulse:${POSTGRES_PASSWORD}@db:5432/aeropulse
    volumes: [exports:/app/exports, ./collector.sh:/app/collector.sh:ro]
    command: ["sh", "/app/collector.sh"]
    depends_on: { db: { condition: service_healthy } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [app]

volumes: { pgdata: {}, exports: {}, caddydata: {} }
