name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -p no:warnings
      - name: Migrations apply cleanly
        run: python -c "from aeropulse.db.migrate import upgrade; upgrade('sqlite:///ci.db')"

  web:
    runs-on: ubuntu-latest
    env:
      AEROPULSE_SITE_KEY: ci-only-not-secret
      AEROPULSE_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_AEROPULSE_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e .
      - name: Start the API over demo data
        run: |
          aeropulse demo
          nohup aeropulse serve --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
